; config.ini nomi bilan nusxa oling va to'ldiring

[general]
log_level = INFO
; Bir xil QR ketma-ket o'qilsa, shuncha soniya e'tiborsiz qoldiriladi
same_code_ignore_seconds = 4
; true bo'lsa avval TicketInfoAsync, keyin ValidateTicketAsync chaqiriladi
call_ticket_info = false
; Turniketni ochish usuli:
;   http  — tarmoq rele (LAN/Wi-Fi: Shelly, Sonoff, KMtronic), panel yonida turadi
;   relay — USB rele (PUSH proshivkali C3 uchun, tavsiya etiladi)
;   c3    — C3 panelga tarmoq orqali buyruq (faqat PULL proshivka, 4370-port ochiq bo'lsa)
open_mode = relay

[api]
; ЕЭСБО serverining manzili (hujjatda faqat /api/CultureTicket/... yo'li berilgan)
base_url = https://SERVER_MANZILI
; acdf.uz bergan validator/kassir login-paroli
login = your_login
password = your_password
timeout = 8
token_refresh_minutes = 60
verify_tls = true

[panel]
ip = 192.168.1.201
port = 4370
; ZKAccess'da Communication password qo'yilgan bo'lsa yozing, bo'lmasa bo'sh
comm_password =
; Turniket ulangan eshik raqami (LOCK1 = 1, LOCK2 = 2)
door = 1
; Rele necha soniya yopiq turadi (turniket bir o'tishga ochiladi)
open_seconds = 5

[reader]
; QR50BM RS485 -> USB adapter porti
; Windows: COM3, COM4 ...   Linux: /dev/ttyUSB0
; RS485->Ethernet konverter (USR-TCP232 va h.k., TCP Server rejimi): socket://192.168.1.220:8899
serial_port = COM3
baudrate = 9600

[relay]
; USB rele (LCUS-1, CH340) COM-porti. Reader portidan BOSHQA port bo'ladi
serial_port = COM4
baudrate = 9600
; Rele necha soniya yopiladi (tugma bosilishini taqlid qiladi)
pulse_seconds = 0.5

[http_relay]
; Shelly 1 / Shelly Plus 1 misoli: 1 soniyaga yoqib, o'zi o'chadi
on_url = http://192.168.1.210/relay/0?turn=on&timer=1
off_url =
; KMtronic LAN rele misoli:
;   on_url  = http://192.168.1.199/FF0101
;   off_url = http://192.168.1.199/FF0100
pulse_seconds = 0.5
user =
password =
