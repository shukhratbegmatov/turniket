; ============================================================
;  ЕЭСБО -> turniket shlyuzi sozlamalari (Shahrisabz muzeyi)
; ============================================================

[general]
log_level = INFO
; Bir xil QR ketma-ket o'qilsa, shuncha soniya e'tiborsiz qoldiriladi
same_code_ignore_seconds = 4
; true bo'lsa avval TicketInfoAsync, keyin ValidateTicketAsync chaqiriladi
call_ticket_info = false
; Turniketni ochish usuli:
;   http  — tarmoq rele (Shelly / LAN rele) C3 BUTTON1 ga ulangan   <- tavsiya
;   relay — USB rele C3 BUTTON1 ga ulangan
;   c3    — C3 panelga 4370-port orqali (sizning panelingizda ISHLAMAYDI, PUSH proshivka)
open_mode = http

[api]
base_url = https://cabinet.cultureticket.uz
login = adolat
password = 12345
timeout = 8
token_refresh_minutes = 60
verify_tls = true

[panel]
ip = 192.168.1.201
port = 4370
comm_password =
door = 1
open_seconds = 5

[reader]
; QR o'quvchi qayerdan o'qiladi:
;   RS485->Ethernet konverter:  socket://KONVERTER_IP:8899
;   RS485->USB adapter:         COM3 (Device Manager'dagi raqam)
serial_port = socket://192.168.1.220:8899
baudrate = 9600

[relay]
; USB rele ishlatilsa (open_mode = relay)
serial_port = COM4
baudrate = 9600
pulse_seconds = 0.5

[http_relay]
; Tarmoq rele (open_mode = http). IP ni releingizniki bilan almashtiring.
; Shelly 1 / Shelly Plus 1:
on_url = http://192.168.1.210/relay/0?turn=on&timer=1
off_url =
; KMtronic LAN rele bo'lsa:
;   on_url  = http://192.168.1.210/FF0101
;   off_url = http://192.168.1.210/FF0100
pulse_seconds = 0.5
user =
password =
